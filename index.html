```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #gallery {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #photo {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #message {
      color: white;
      text-align: center;
      padding: 20px;
      line-height: 1.6;
    }

    #counter {
      position: fixed;
      bottom: 14px;
      right: 16px;
      color: white;
      opacity: 0.6;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="gallery">
    <img id="photo" alt="Ảnh">
    <div id="message">Đang tải ảnh...</div>
  </div>

  <div id="counter"></div>

  <audio id="music" preload="auto" loop></audio>

  <script>
    const REPO_OWNER = "khonnan135797531";
    const REPO_NAME = "khonnan135797531.github.io";

    const gallery = document.getElementById("gallery");
    const photo = document.getElementById("photo");
    const message = document.getElementById("message");
    const counter = document.getElementById("counter");
    const music = document.getElementById("music");

    let photos = [];
    let sounds = new Map();
    let currentIndex = 0;
    let currentSoundHash = null;
    let busy = false;

    // Lấy số thứ tự từ tên file
    function getNumber(filename, prefix) {
      const match = filename.match(
        new RegExp("^" + prefix + "(\\d+)\\.", "i")
      );

      return match ? Number(match[1]) : null;
    }

    // Tự tìm ảnh và nhạc trong repo GitHub
    async function loadFiles() {
      try {
        const url =
          `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Không đọc được danh sách file GitHub.");
        }

        const files = await response.json();

        // Tìm toàn bộ ảnh và sắp xếp theo số
        photos = files
          .filter(file =>
            file.type === "file" &&
            /^anh\d+\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
          )
          .map(file => ({
            number: getNumber(file.name, "anh"),
            url: file.download_url
          }))
          .sort((a, b) => a.number - b.number);

        // Tìm toàn bộ file nhạc
        const audioFiles = files.filter(file =>
          file.type === "file" &&
          /^nhac\d+\.mp3$/i.test(file.name)
        );

        for (const file of audioFiles) {
          const number = getNumber(file.name, "nhac");

          sounds.set(number, {
            url: file.download_url,
            hash: null
          });
        }

        if (photos.length === 0) {
          message.textContent =
            "Chưa tìm thấy ảnh. Hãy kiểm tra tên anh1.jpg, anh2.jpg...";
          return;
        }

        // Kiểm tra các file nhạc có giống hệt nhau không
        await prepareSoundHashes();

        showPhoto(0);
        await changeMusic(photos[0].number);

      } catch (error) {
        console.error(error);

        message.textContent =
          "Không tải được ảnh. Hãy kiểm tra kết nối mạng hoặc repo GitHub.";
      }
    }

    // So sánh nội dung file nhạc bằng SHA-256
    async function prepareSoundHashes() {
      if (!window.crypto || !crypto.subtle) return;

      for (const sound of sounds.values()) {
        try {
          const response = await fetch(sound.url);

          if (!response.ok) continue;

          const data = await response.arrayBuffer();
          const hash = await crypto.subtle.digest("SHA-256", data);

          sound.hash = Array.from(new Uint8Array(hash))
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");
        } catch (error) {
          console.warn("Không thể kiểm tra file nhạc:", error);
        }
      }
    }

    // Hiển thị ảnh
    function showPhoto(index) {
      currentIndex = index;

      photo.src = photos[index].url;
      photo.style.display = "block";
      message.style.display = "none";

      counter.textContent = `${index + 1} / ${photos.length}`;
    }

    // Chuyển nhạc và giữ nhạc chạy liền mạch nếu cùng bản
    async function changeMusic(photoNumber) {
      const sound = sounds.get(photoNumber);

      if (!sound) {
        music.pause();
        music.removeAttribute("src");
        music.load();
        currentSoundHash = null;
        return;
      }

      // Nếu là cùng bản nhạc, không khởi động lại
      if (
        sound.hash &&
        currentSoundHash &&
        sound.hash === currentSoundHash
      ) {
        if (music.paused) {
          try {
            await music.play();
          } catch (error) {
            // Có thể cần người dùng chạm màn hình để phát nhạc
          }
        }
        return;
      }

      music.pause();
      music.src = sound.url;
      music.load();

      currentSoundHash = sound.hash;

      try {
        await music.play();
      } catch (error) {
        // Thử phát lại khi người dùng chạm màn hình
      }
    }

    // Chạm màn hình để sang ảnh tiếp theo
    gallery.addEventListener("click", async () => {
      if (busy || photos.length === 0) return;

      // Đã đến ảnh cuối thì không chuyển tiếp nữa
      if (currentIndex >= photos.length - 1) return;

      busy = true;

      const nextIndex = currentIndex + 1;

      showPhoto(nextIndex);
      await changeMusic(photos[nextIndex].number);

      busy = false;
    });

    // Khởi chạy website
    loadFiles();
  </script>
</body>
</html>
