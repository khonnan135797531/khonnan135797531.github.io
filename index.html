<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  
<title>viecnheluongcao</title>
<meta property="og:title" content="viecnhueluongcao">
<meta property="og:description" content="">
<meta property="og:type" content="website">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#gallery {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#photo {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

#message {
  color: white;
  text-align: center;
}

#counter {
  position: fixed;
  right: 16px;
  bottom: 14px;
  color: white;
  opacity: 0.6;
  pointer-events: none;
}
</style>
</head>

<body>
<div id="gallery">
  <img id="photo" alt="Ảnh" style="display:none">
  <div id="message">Đang tải ảnh...</div>
</div>

<div id="counter"></div>
<audio id="music" preload="auto" loop></audio>

<script>
const OWNER = "khonnan135797531";
const REPO = "khonnan135797531.github.io";

const gallery = document.getElementById("gallery");
const photo = document.getElementById("photo");
const message = document.getElementById("message");
const counter = document.getElementById("counter");
const music = document.getElementById("music");

let photos = [];
let sounds = {};
let currentIndex = 0;
let currentSoundHash = null;
let busy = false;
let started = false;

function getNumber(name, prefix) {
  const match = name.match(new RegExp("^" + prefix + "(\\d+)\\.", "i"));
  return match ? Number(match[1]) : null;
}

async function loadFiles() {
  try {
    const response = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/?t=${Date.now()}`
    );

    if (!response.ok) throw new Error("GitHub không trả về danh sách file.");

    const files = await response.json();

    photos = files
      .filter(f => f.type === "file" &&
        /^anh\d+\.(jpg|jpeg|png|webp|gif)$/i.test(f.name))
      .map(f => ({
        number: getNumber(f.name, "anh"),
        url: f.download_url
      }))
      .sort((a, b) => a.number - b.number);

    files
      .filter(f => f.type === "file" && /^nhac\d+\.mp3$/i.test(f.name))
      .forEach(f => {
        sounds[getNumber(f.name, "nhac")] = {
          url: f.download_url,
          hash: null
        };
      });

    if (!photos.length) {
      message.textContent = "Không tìm thấy ảnh.";
      return;
    }

    await prepareHashes();

    started = true;
    showPhoto(0);
    await changeMusic(photos[0].number);

  } catch (error) {
    console.error(error);
    message.textContent = "Không tải được ảnh. Hãy thử tải lại trang.";
  }
}

async function prepareHashes() {
  if (!window.crypto || !crypto.subtle) return;

  for (const sound of Object.values(sounds)) {
    try {
      const response = await fetch(sound.url);
      if (!response.ok) continue;

      const data = await response.arrayBuffer();
      const hash = await crypto.subtle.digest("SHA-256", data);

      sound.hash = Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    } catch (error) {
      console.warn("Không kiểm tra được file nhạc:", error);
    }
  }
}

function showPhoto(index) {
  photo.src = photos[index].url;
  photo.style.display = "block";
  message.style.display = "none";
  counter.textContent = `${index + 1} / ${photos.length}`;
}

async function changeMusic(number) {
  const sound = sounds[number];

  if (!sound) {
    music.pause();
    music.removeAttribute("src");
    music.load();
    currentSoundHash = null;
    return;
  }

  if (sound.hash && currentSoundHash &&
      sound.hash === currentSoundHash) {
    if (music.paused) {
      try { await music.play(); } catch (error) {}
    }
    return;
  }

  music.pause();
  music.src = sound.url;
  music.load();
  currentSoundHash = sound.hash;

  try { await music.play(); } catch (error) {}
}

gallery.addEventListener("click", async function () {
  if (!started || busy) return;

  // QUAN TRỌNG: Ở ảnh cuối thì thoát ngay.
  if (currentIndex >= photos.length - 1) return;

  busy = true;

  // Chỉ tăng chỉ số, tuyệt đối không quay về 0.
  const nextIndex = currentIndex + 1;

  // Chặn nếu chỉ số vượt giới hạn.
  if (nextIndex >= photos.length) {
    busy = false;
    return;
  }

  currentIndex = nextIndex;
  showPhoto(currentIndex);

  await changeMusic(photos[currentIndex].number);

  busy = false;
});

loadFiles();
</script>
</body>
</html>
