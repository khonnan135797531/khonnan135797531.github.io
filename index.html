```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #gallery {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #photo {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #message {
      color: white;
      text-align: center;
      padding: 20px;
    }

    #counter {
      position: fixed;
      bottom: 14px;
      right: 16px;
      color: white;
      opacity: 0.6;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="gallery">
    <img id="photo" alt="Ảnh" style="display:none">
    <div id="message">Đang tải ảnh...</div>
  </div>

  <div id="counter"></div>
  <audio id="music" preload="auto" loop></audio>

  <script>
    const OWNER = "khonnan135797531";
    const REPO = "khonnan135797531.github.io";

    const gallery = document.getElementById("gallery");
    const photo = document.getElementById("photo");
    const message = document.getElementById("message");
    const counter = document.getElementById("counter");
    const music = document.getElementById("music");

    let photos = [];
    let sounds = {};
    let currentIndex = 0;
    let currentSoundHash = null;
    let busy = false;
    let finished = false;

    function getNumber(name, prefix) {
      const match = name.match(
        new RegExp("^" + prefix + "(\\d+)\\.", "i")
      );
      return match ? Number(match[1]) : null;
    }

    async function loadFiles() {
      try {
        const response = await fetch(
          `https://api.github.com/repos/${OWNER}/${REPO}/contents/`
        );

        if (!response.ok) throw new Error("Không tải được danh sách file.");

        const files = await response.json();

        photos = files
          .filter(f =>
            f.type === "file" &&
            /^anh\d+\.(jpg|jpeg|png|webp|gif)$/i.test(f.name)
          )
          .map(f => ({
            number: getNumber(f.name, "anh"),
            url: f.download_url
          }))
          .sort((a, b) => a.number - b.number);

        files
          .filter(f =>
            f.type === "file" &&
            /^nhac\d+\.mp3$/i.test(f.name)
          )
          .forEach(f => {
            sounds[getNumber(f.name, "nhac")] = {
              url: f.download_url,
              hash: null
            };
          });

        if (photos.length === 0) {
          message.textContent = "Không tìm thấy ảnh!";
          return;
        }

        await prepareHashes();

        showPhoto(0);
        await changeMusic(photos[0].number);

      } catch (error) {
        console.error(error);
        message.textContent =
          "Không tải được ảnh. Hãy kiểm tra mạng hoặc GitHub.";
      }
    }

    async function prepareHashes() {
      if (!crypto.subtle) return;

      for (const sound of Object.values(sounds)) {
        try {
          const response = await fetch(sound.url);
          if (!response.ok) continue;

          const data = await response.arrayBuffer();
          const hash = await crypto.subtle.digest("SHA-256", data);

          sound.hash = Array.from(new Uint8Array(hash))
            .map(b => b.toString(16).padStart(2, "0"))
            .join("");
        } catch (error) {
          console.warn(error);
        }
      }
    }

    function showPhoto(index) {
      currentIndex = index;
      photo.src = photos[index].url;
      photo.style.display = "block";
      message.style.display = "none";
      counter.textContent = `${index + 1} / ${photos.length}`;
    }

    async function changeMusic(number) {
      const sound = sounds[number];

      if (!sound) {
        music.pause();
        music.removeAttribute("src");
        music.load();
        currentSoundHash = null;
        return;
      }

      if (
        sound.hash &&
        currentSoundHash &&
        sound.hash === currentSoundHash
      ) {
        if (music.paused) {
          try {
            await music.play();
          } catch (error) {}
        }
        return;
      }

      music.pause();
      music.src = sound.url;
      music.load();
      currentSoundHash = sound.hash;

      try {
        await music.play();
      } catch (error) {}
    }

    gallery.addEventListener("click", async function () {
      // Chặn mọi lần bấm khi đang xử lý hoặc đã đến ảnh cuối
      if (busy || finished || photos.length === 0) return;

      // Đánh dấu kết thúc trước khi xử lý bất kỳ thao tác nào
      if (currentIndex === photos.length - 1) {
        finished = true;
        return;
      }

      busy = true;

      const nextIndex = currentIndex + 1;

      showPhoto(nextIndex);
      await changeMusic(photos[nextIndex].number);

      // Đến ảnh cuối thì khóa hẳn việc chuyển ảnh
      if (currentIndex === photos.length - 1) {
        finished = true;
      }

      busy = false;
    });

    loadFiles();
  </script>
</body>
</html>
